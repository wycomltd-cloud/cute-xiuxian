<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- 移動優先 viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>今天也在摸魚修仙｜可愛放置小仙境</title>
  <meta name="description" content="人可以休息，修為照樣上班。可愛幽默的完整放置修仙：功法、靈寵、煉丹、探索、道友與輪回。">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cute.css?v=1.4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    /* 啓動佔位樣式（防白屏閃爍），主樣式在 css/style.css */

    #boot-loading {
      padding: 48px 16px; text-align: center; color: #2b2b2b;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
    }
  </style>
</head>
<body>
  <header class="cute-masthead">
    <div class="cute-logo"><span class="cute-logo-mark" aria-hidden="true">🍵</span><div><h1>今天也在摸魚修仙</h1><small>A LITTLE CULTIVATION, A LOT OF CHILL.</small></div></div>
    <div class="cute-mast-actions"><span class="cute-status">仙氣供應正常</span><button class="cute-icon-btn" data-cute-help aria-label="新手說明">?</button><button class="cute-icon-btn" data-cute-tab="settings" aria-label="設定與存檔">⚙</button></div>
  </header>
  <div class="cute-shell">
  <aside class="cute-sidebar" aria-label="遊戲導覽"><nav id="cute-side-nav"></nav><div class="cute-sidebar-note"><span>☁️</span><b>今日份仙界小提醒</b>你負責好好生活，<br>修為負責偷偷長大。<br>離線也有收益，最多48小時。</div><p class="cute-attribution">可愛改作 · v1.4<br>Based on <a href="https://github.com/shanawakiminouso-hub/xiuxian-idle" target="_blank" rel="noopener">xiuxian-idle</a> · <a href="LICENSE">MIT License</a></p></aside>

    <!-- 傳聞滾動條容器（可摺疊） -->
    <div id="news-ticker"></div>
    <!-- 中部 tab 容器 -->
    <main id="tab-container">
      <div id="boot-loading">正在整理蒲團……師父說，舒服才能修得久。</div>
    </main>
    <!-- 底部主導航容器（修煉/功法/洞府/歷練/更多） -->
    <nav id="bottom-nav"></nav>
  </div>

  </div>

  <!-- 彈窗 / 特效 / 輕提示 / 浮動跳字 掛載容器 -->

  <div id="fx-root"></div>
